<html lang="th">
<head>
    <meta charset="UTF-8">

    <style>
        body { background-color: #f8fafc; font-family: 'Prompt', sans-serif; -webkit-tap-highlight-color: transparent; }
        .bg-gradient-primary { background: linear-gradient(135deg, #002d63 0%, #0056b3 100%); }
        .bg-gradient-success { background: linear-gradient(135deg, #059669 0%, #10b981 100%); }
        .bg-gradient-warning { background: linear-gradient(135deg, #d97706 0%, #f59e0b 100%); }
        .bg-gradient-danger { background: linear-gradient(135deg, #dc2626 0%, #ef4444 100%); }
        .mobile-container { max-width: 480px; margin: 0 auto; min-height: 100vh; background-color: white; padding-bottom: 90px; position: relative; box-shadow: 0 0 20px rgba(0,0,0,0.05); }
        .input-rounded { border-radius: 12px; border: 1px solid #e2e8f0; transition: all 0.2s; appearance: none; }
        .input-rounded:focus { border-color: #0056b3; box-shadow: 0 0 0 3px rgba(0, 86, 179, 0.1); outline: none; }
        .loader { border: 3px solid #f3f3f3; border-radius: 50%; border-top: 3px solid #002d63; width: 32px; height: 32px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .audience-ttb { background-color: #3b82f6; }
        .audience-pd { background-color: #10b981; }
        .audience-pru { background-color: #8b5cf6; }
        .audience-customer { background-color: #f59e0b; }
        .audience-other { background-color: #6b7280; }
        .badge-online { background-color: #10b981; color: white; }
        .badge-f2f { background-color: #3b82f6; color: white; }
        .badge-leave { background-color: #ef4444; color: white; }
        .task-card { transition: all 0.2s; border-left-width: 4px; }
        .task-card:hover { transform: translateY(-2px); box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); }
        .fc { font-size: 0.9em; }
        .fc-toolbar-title { font-size: 1.2em !important; }
        .fc-daygrid-event { border-radius: 6px !important; border: none !important; padding: 2px 4px !important; }
        .heatmap-cell { transition: all 0.2s; cursor: pointer; }
        .heatmap-cell:hover { opacity: 0.8; }
    </style>
</head>
<body>

    <!-- Supabase Configuration -->
    <script>
        const SUPABASE_URL = 'https://qcvorkbqdsdcphpflksa.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFjdm9ya2JxZHNkY3BocGZsa3NhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjkzMTQ2MjUsImV4cCI6MjA4NDg5MDYyNX0.LMsGr_kitA7bSb4IHSa6kEP9Tu35Y2YFc71Hyq76eq0';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        // Global variables
        let authUser = null;
        let profile = null;
        let allUsers = [];
        let allTasks = [];
        let calendar = null;
    </script>

    <!-- LOGIN SCREEN -->
    <div id="login-screen" class="mobile-container flex flex-col justify-center items-center p-8 bg-white absolute inset-0 z-[100]">
        <div class="w-20 h-20 rounded-2xl bg-gradient-primary flex items-center justify-center text-white font-bold text-3xl shadow-xl mb-6">ttb</div>
        <h2 class="text-xl font-bold text-slate-800 mb-1">ttb trainer task v3.0</h2>
        <p class="text-slate-400 text-xs mb-8 text-center px-4">กรุณาเข้าสู่ระบบเพื่อจัดการตารางงาน</p>

        <form id="login-form" class="w-full space-y-4">
            <div>
                <label class="block text-[10px] font-bold text-slate-500 mb-1.5 ml-1 uppercase">Username / Email</label>
                <input type="text" id="login-id" required class="input-rounded w-full px-5 py-3.5 bg-slate-50 text-sm" placeholder="ระบุ email" autocomplete="username">
            </div>
            <div>
                <label class="block text-[10px] font-bold text-slate-500 mb-1.5 ml-1 uppercase">Password</label>
                <input type="password" id="login-password" required class="input-rounded w-full px-5 py-3.5 bg-slate-50 text-sm" placeholder="••••••••" autocomplete="current-password">
            </div>
            <button type="submit" id="btn-login" class="w-full bg-gradient-primary text-white font-bold py-4 rounded-xl shadow-lg active:scale-95 transition-transform mt-2">
                เข้าสู่ระบบ
            </button>
            <div id="login-error" class="text-red-500 text-[11px] text-center hidden p-3 bg-red-50 rounded-xl border border-red-100"></div>
        </form>
        <p class="mt-auto text-[10px] text-slate-300">v3.0 Complete System</p>
    </div>

    <!-- MAIN APP -->
    <div id="app" class="mobile-container hidden">
        <header class="sticky top-0 z-40 bg-white/90 backdrop-blur-lg border-b border-slate-100 px-5 py-4 flex justify-between items-center">
            <div class="flex gap-2">
    <!-- Reports Button (for Admin/Master only) -->
    <button id="reports-btn" onclick="renderReports()" 
            class="hidden text-slate-300 hover:text-green-500 p-2">
        <i class="fas fa-chart-bar"></i>
    </button>
    
    <!-- User Management Button (for Admin/Master only) -->
    <button id="user-management-btn" onclick="renderUserManagement()" 
            class="hidden text-slate-300 hover:text-purple-500 p-2">
        <i class="fas fa-users-cog"></i>
    </button>
    
    <button onclick="handleLogout()" class="text-slate-300 hover:text-red-500 p-2">
        <i class="fa-solid fa-power-off"></i>
    </button>
</div>
        </header>

        <main id="main-content" class="px-5 py-6"></main>

        <!-- Navigation for ALL USERS -->
        <nav id="trainer-nav" class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[480px] bg-white border-t border-slate-100 flex justify-around items-center py-3 z-50">
            <button onclick="renderDashboard()" class="nav-btn flex flex-col items-center gap-1 text-slate-400" id="nav-home">
                <i class="fa-solid fa-house"></i><span class="text-[9px]">Home</span>
            </button>
            <button onclick="renderCalendar()" class="nav-btn flex flex-col items-center gap-1 text-slate-400" id="nav-calendar">
                <i class="fa-solid fa-calendar"></i><span class="text-[9px]">ตารางงาน</span>
            </button>
            <button onclick="renderCreateTask()" class="w-12 h-12 bg-gradient-primary rounded-full text-white shadow-lg -mt-8 border-4 border-white"><i class="fa-solid fa-plus"></i></button>
            <button onclick="renderSearch()" class="nav-btn flex flex-col items-center gap-1 text-slate-400" id="nav-search">
                <i class="fa-solid fa-search"></i><span class="text-[9px]">วันว่าง</span>
            </button>
            <button onclick="renderProfile()" class="nav-btn flex flex-col items-center gap-1 text-slate-400" id="nav-profile">
                <i class="fa-solid fa-user"></i><span class="text-[9px]">โปรไฟล์</span>
            </button>
        </nav>
    </div>

    <!-- LOADING OVERLAY -->
    <div id="loading-overlay" class="fixed inset-0 bg-white/70 backdrop-blur-sm z-[200] flex items-center justify-center hidden">
        <div class="loader"></div>
        <div class="ml-3 text-slate-700 text-sm">กำลังโหลด...</div>
    </div>

    <!-- CONFIRMATION MODAL -->
    <div id="confirmation-modal" class="fixed inset-0 bg-black/50 z-[300] flex items-center justify-center hidden">
        <div class="bg-white rounded-2xl p-6 m-4 max-w-sm w-full">
            <h3 class="font-bold text-lg" id="modal-title">ยืนยันการลบ</h3>
            <p class="text-slate-600 mb-6" id="modal-message">คุณแน่ใจหรือไม่ที่ต้องการลบรายการนี้?</p>
            <div class="flex gap-3">
                <button onclick="hideModal()" class="flex-1 py-3 border border-slate-300 rounded-xl text-slate-700">ยกเลิก</button>
                <button onclick="confirmAction()" id="confirm-btn" class="flex-1 py-3 bg-red-500 text-white rounded-xl">ยืนยัน</button>
            </div>
        </div>
    </div>

    <!-- TASK DETAIL MODAL -->
    <div id="task-modal" class="fixed inset-0 bg-black/50 z-[300] flex items-center justify-center hidden">
        <div class="bg-white rounded-2xl p-6 m-4 max-w-sm w-full max-h-[80vh] overflow-y-auto">
            <div class="flex justify-between items-start mb-4">
                <h3 class="font-bold text-lg">รายละเอียดงาน</h3>
                <button onclick="hideTaskModal()" class="text-slate-400"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="task-modal-content"></div>
        </div>
    </div>

    <!-- MAIN SCRIPT -->
    <script>
        // ==================== UTILITY FUNCTIONS ====================
        function showLoading(show) {
            document.getElementById('loading-overlay').classList.toggle('hidden', !show);
        }

        function showModal(title, message, confirmCallback) {
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-message').textContent = message;
            window.confirmCallback = confirmCallback;
            document.getElementById('confirmation-modal').classList.remove('hidden');
        }

        function hideModal() {
            document.getElementById('confirmation-modal').classList.add('hidden');
        }

        function confirmAction() {
            if (window.confirmCallback) window.confirmCallback();
            hideModal();
        }

        function showTaskModal(content) {
            document.getElementById('task-modal-content').innerHTML = content;
            document.getElementById('task-modal').classList.remove('hidden');
        }

        function hideTaskModal() {
            document.getElementById('task-modal').classList.add('hidden');
        }

        function showNotification(message, type = 'success') {
            const colors = {
                success: 'bg-green-100 text-green-800 border-green-200',
                error: 'bg-red-100 text-red-800 border-red-200',
                warning: 'bg-yellow-100 text-yellow-800 border-yellow-200',
                info: 'bg-blue-100 text-blue-800 border-blue-200'
            };
            
            const notification = document.createElement('div');
            notification.className = `fixed top-4 right-4 z-[400] p-4 rounded-xl shadow-lg ${colors[type]} transition-all duration-300`;
            notification.textContent = message;
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.remove();
            }, 3000);
        }

        function formatDateThai(dateStr) {
            const date = new Date(dateStr);
            const days = ['อาทิตย์', 'จันทร์', 'อังคาร', 'พุธ', 'พฤหัสบดี', 'ศุกร์', 'เสาร์'];
            const months = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];
            return `${days[date.getDay()]}ที่ ${date.getDate()} ${months[date.getMonth()]} ${date.getFullYear() + 543}`;
        }

        function formatTime(timeStr) {
            return timeStr.substring(0, 5);
        }

        // ==================== AUTHENTICATION ====================
        document.getElementById('login-form').addEventListener('submit', handleLogin);

        async function handleLogin(e) {
            e.preventDefault();
            const loginId = document.getElementById('login-id').value.trim();
            const password = document.getElementById('login-password').value;
            const errDiv = document.getElementById('login-error');
            
            errDiv.classList.add('hidden');
            showLoading(true);

            try {
                let email = loginId;
                
                if (!loginId.includes('@')) {
                    const { data: p, error: pErr } = await supabaseClient
                        .from('profiles')
                        .select('email')
                        .eq('user_id_code', loginId)
                        .single();
                    
                    if (!pErr && p) {
                        email = p.email;
                    }
                }

                const { data, error } = await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (error) throw error;
                await loadAppData(data.user);

            } catch (err) {
                console.error("Login Error:", err.message);
                errDiv.textContent = "เข้าสู่ระบบไม่สำเร็จ: " + (err.message === 'Invalid login credentials' ? 'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง' : err.message);
                errDiv.classList.remove('hidden');
            } finally {
                showLoading(false);
            }
        }

        async function loadAppData(user) {
            authUser = user;
            
            // Load profile
            const { data: p, error } = await supabaseClient
                .from('profiles')
                .select('*')
                .eq('id', user.id)
                .single();
            
            if (error) {
                console.error("Profile load error:", error);
                alert("โหลดข้อมูลโปรไฟล์ไม่สำเร็จ");
                return;
            }

            profile = p;
            
            // Load all users for dropdowns
            await loadAllUsers();
            
            // Load all tasks
            await loadAllTasks();
            
            // Update UI
            document.getElementById('user-display-name').textContent = p.display_name || p.full_name;
            document.getElementById('user-role-badge').textContent = p.role;
            document.getElementById('user-avatar').textContent = (p.display_name || 'U').substring(0, 2);
            
            // Show user management button for admin/master only
            const reportsBtn = document.getElementById('reports-btn');
const userManagementBtn = document.getElementById('user-management-btn');

if (p.role === 'admin' || p.role === 'master') {
    reportsBtn.classList.remove('hidden');
    userManagementBtn.classList.remove('hidden');
} else {
    reportsBtn.classList.add('hidden');
    userManagementBtn.classList.add('hidden');
}
            
            // Switch screens
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('app').classList.remove('hidden');
            
            // Start with dashboard
            renderDashboard();
        }

        async function loadAllUsers() {
            const { data, error } = await supabaseClient
                .from('profiles')
                .select('*')
                .order('display_name');
            
            if (!error) allUsers = data;
        }

        async function loadAllTasks() {
            const { data, error } = await supabaseClient
                .from('tasks')
                .select(`
                    *,
                    trainer:profiles!tasks_trainer_id_fkey(display_name, full_name),
                    creator:profiles!tasks_created_by_fkey(display_name)
                `)
                .order('date', { ascending: true });
            
            if (!error) allTasks = data;
        }

        async function handleLogout() {
            showModal('ออกจากระบบ', 'คุณแน่ใจหรือไม่ที่จะออกจากระบบ?', async () => {
                await supabaseClient.auth.signOut();
                window.location.reload();
            });
        }

        // ==================== 1. HOME PAGE ====================
        async function renderDashboard() {
            showLoading(true);
            
            // Get today and tomorrow's tasks for current user
            const today = new Date().toISOString().split('T')[0];
            const tomorrow = new Date(Date.now() + 86400000).toISOString().split('T')[0];
            
            const { data: userTasks } = await supabaseClient
                .from('tasks')
                .select('*')
                .or(`and(trainer_id.eq.${authUser.id},date.eq.${today}),and(trainer_id.eq.${authUser.id},date.eq.${tomorrow})`)
                .order('start_time');
            
            // Get current month stats
            const currentMonth = new Date().getMonth() + 1;
            const currentYear = new Date().getFullYear();
            
            const { data: monthTasks } = await supabaseClient
                .from('tasks')
                .select('*')
                .eq('trainer_id', authUser.id)
                .gte('date', `${currentYear}-${currentMonth.toString().padStart(2, '0')}-01`)
                .lte('date', `${currentYear}-${currentMonth.toString().padStart(2, '0')}-31`);
            
            // Calculate statistics
            const totalHours = monthTasks ? monthTasks.reduce((sum, task) => {
                const start = new Date(`2000-01-01T${task.start_time}`);
                const end = new Date(`2000-01-01T${task.end_time}`);
                return sum + (end - start) / 3600000;
            }, 0) : 0;
            
            const onlineCount = monthTasks ? monthTasks.filter(t => t.format === 'Online').length : 0;
            const f2fCount = monthTasks ? monthTasks.filter(t => t.format === 'F2F').length : 0;
            
            // Get team stats
            const { data: teamTasks } = await supabaseClient
                .from('tasks')
                .select('*')
                .gte('date', `${currentYear}-${currentMonth.toString().padStart(2, '0')}-01`)
                .lte('date', `${currentYear}-${currentMonth.toString().padStart(2, '0')}-31`);
            
            const teamOnlineCount = teamTasks ? teamTasks.filter(t => t.format === 'Online').length : 0;
            const teamF2fCount = teamTasks ? teamTasks.filter(t => t.format === 'F2F').length : 0;
            
            const content = `
                <div class="mb-6">
                    <h2 class="text-xl font-bold text-slate-800 mb-4">🏠 Dashboard</h2>
                    
                    <!-- Today & Tomorrow Tasks -->
                    <div class="grid grid-cols-2 gap-4 mb-6">
                        <div class="bg-blue-50 rounded-2xl p-4 border border-blue-100">
                            <h3 class="font-bold text-blue-800 text-sm mb-2">งานวันนี้</h3>
                            <p class="text-2xl font-bold text-blue-600">
                                ${userTasks ? userTasks.filter(t => t.date === today).length : 0}
                                <span class="text-sm font-normal">งาน</span>
                            </p>
                        </div>
                        <div class="bg-green-50 rounded-2xl p-4 border border-green-100">
                            <h3 class="font-bold text-green-800 text-sm mb-2">งานพรุ่งนี้</h3>
                            <p class="text-2xl font-bold text-green-600">
                                ${userTasks ? userTasks.filter(t => t.date === tomorrow).length : 0}
                                <span class="text-sm font-normal">งาน</span>
                            </p>
                        </div>
                    </div>
                    
                    <!-- Monthly Stats -->
                    <div class="bg-gradient-primary rounded-2xl p-5 text-white mb-6">
                        <h3 class="font-bold mb-4">📊 สถิติเดือนนี้</h3>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <p class="text-sm opacity-90">ชั่วโมงสอน</p>
                                <p class="text-2xl font-bold">${totalHours.toFixed(1)}<span class="text-sm font-normal"> ชม.</span></p>
                            </div>
                            <div>
                                <p class="text-sm opacity-90">จำนวนคลาส</p>
                                <p class="text-2xl font-bold">${monthTasks ? monthTasks.length : 0}<span class="text-sm font-normal"> คลาส</span></p>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Online vs F2F Ratio -->
                    <div class="grid grid-cols-2 gap-4 mb-6">
                        <div class="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm">
                            <h3 class="font-bold text-slate-700 text-sm mb-3">รูปแบบของคุณ</h3>
                            <div class="h-32">
                                <canvas id="personalChart"></canvas>
                            </div>
                            <div class="flex justify-center gap-4 mt-3">
                                <div class="flex items-center">
                                    <div class="w-3 h-3 rounded-full bg-green-500 mr-2"></div>
                                    <span class="text-xs">Online: ${onlineCount}</span>
                                </div>
                                <div class="flex items-center">
                                    <div class="w-3 h-3 rounded-full bg-blue-500 mr-2"></div>
                                    <span class="text-xs">F2F: ${f2fCount}</span>
                                </div>
                            </div>
                        </div>
                        <div class="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm">
                            <h3 class="font-bold text-slate-700 text-sm mb-3">ภาพรวมทีม</h3>
                            <div class="h-32">
                                <canvas id="teamChart"></canvas>
                            </div>
                            <div class="flex justify-center gap-4 mt-3">
                                <div class="flex items-center">
                                    <div class="w-3 h-3 rounded-full bg-green-500 mr-2"></div>
                                    <span class="text-xs">Online: ${teamOnlineCount}</span>
                                </div>
                                <div class="flex items-center">
                                    <div class="w-3 h-3 rounded-full bg-blue-500 mr-2"></div>
                                    <span class="text-xs">F2F: ${teamF2fCount}</span>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Today's Tasks List -->
                    <div class="bg-white rounded-2xl p-4 border border-slate-200">
                        <h3 class="font-bold text-slate-700 mb-3">📋 งานวันนี้</h3>
                        ${userTasks && userTasks.filter(t => t.date === today).length > 0 ? 
                            userTasks.filter(t => t.date === today).map(task => `
                                <div class="task-card bg-slate-50 rounded-xl p-3 mb-2 border-l-4 ${getAudienceColor(task.audience)}">
                                    <div class="flex justify-between items-start">
                                        <div>
                                            <p class="font-medium text-slate-800">${task.course_details || 'ไม่มีชื่อหลักสูตร'}</p>
                                            <p class="text-xs text-slate-600 mt-1">
                                                <i class="far fa-clock mr-1"></i>${formatTime(task.start_time)} - ${formatTime(task.end_time)}
                                                <span class="mx-2">•</span>
                                                <span class="badge-${task.format === 'Online' ? 'online' : 'f2f'} text-xs px-2 py-0.5 rounded-full">${task.format}</span>
                                            </p>
                                        </div>
                                        <button onclick="viewTaskDetail('${task.id}')" class="text-blue-500 text-sm">
                                            <i class="fas fa-ellipsis-h"></i>
                                        </button>
                                    </div>
                                </div>
                            `).join('') : 
                            '<p class="text-slate-500 text-center py-4">ไม่มีงานสำหรับวันนี้</p>'
                        }
                    </div>
                </div>
            `;
            
            document.getElementById('main-content').innerHTML = content;
            
            // Render charts
            setTimeout(() => {
                renderPersonalChart(onlineCount, f2fCount);
                renderTeamChart(teamOnlineCount, teamF2fCount);
            }, 100);
            
            showLoading(false);
        }

        function renderPersonalChart(online, f2f) {
            const ctx = document.getElementById('personalChart').getContext('2d');
            new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Online', 'F2F'],
                    datasets: [{
                        data: [online, f2f],
                        backgroundColor: ['#10b981', '#3b82f6'],
                        borderWidth: 0

        async function renderTeamHeatmap() {
            const { data: allTasks } = await supabaseClient
                .from('tasks')
                .select(`
                    *,
                    trainer:profiles!tasks_trainer_id_fkey(display_name, role)
                `);
            
            if (!allTasks) return;
            
            // Group tasks by trainer - ใช้ filter ที่ถูกต้อง: ทุกคนยกเว้น master
            const workloadMap = {};
            allTasks.forEach(task => {
                const trainerId = task.trainer_id;
                if (!workloadMap[trainerId]) {
                    workloadMap[trainerId] = {
                        name: task.trainer.display_name,
                        count: 0,
                        role: task.trainer.role
                    };
                }
                workloadMap[trainerId].count++;
            });
            
            const heatmapBody = document.getElementById('heatmap-body');
            const trainers = Object.values(workloadMap).sort((a, b) => b.count - a.count);
            
            heatmapBody.innerHTML = trainers.map(trainer => {
                const intensity = Math.min(trainer.count / 10, 1);
                const colorIntensity = Math.floor(intensity * 100);
                
                return `
                    <tr class="border-t border-slate-100">

        async function searchAvailableDays() {
            showLoading(true);
            
            // Get selected users - ใช้ filter ที่ถูกต้อง: ทุกคนยกเว้น master
            const userGroup = document.querySelector('input[name="user-group"]:checked').value;
            let selectedUserIds = [];
            
            if (userGroup === 'all') {
                selectedUserIds = allUsers.filter(u => u.role !== 'master').map(u => u.id);
            } else if (userGroup === 'training_specialist') {
                selectedUserIds = allUsers.filter(u => u.role === 'training_specialist').map(u => u.id);
            } else if (userGroup === 'mandatory') {
                selectedUserIds = allUsers.filter(u => u.role === 'mandatory').map(u => u.id);
            } else if (userGroup === 'specific') {
                selectedUserIds = Array.from(document.querySelectorAll('.user-checkbox:checked')).map(cb => cb.value);
            }
            
            if (selectedUserIds.length === 0) {
                showNotification('กรุณาเลือกผู้ใช้อย่างน้อย 1 คน', 'error');
                showLoading(false);
                return;
            }
            
            // Get search condition
            const condition = document.getElementById('search-condition').value;
            
            // Get all tasks for selected users
            const { data: tasks } = await supabaseClient
                .from('tasks')
                .select('*')
                .in('trainer_id', selectedUserIds);
            
            // Create occupied days map
            const occupiedDays = {};
            if (tasks) {
                tasks.forEach(task => {
                    if (!occupiedDays[task.trainer_id]) {
                        occupiedDays[task.trainer_id] = new Set();
                    }
                    occupiedDays[task.trainer_id].add(task.date);
                });
            }
            
            // Find available days
            const resultsDiv = document.getElementById('search-results');
            
            if (condition === 'earliest') {
                // Find earliest date where all selected users are available
                const startDate = new Date();
                let foundDate = null;
                
                for (let i = 0; i < 365; i++) { // Search next 365 days
                    const currentDate = new Date(startDate);
                    currentDate.setDate(startDate.getDate() + i);
                    const dateStr = currentDate.toISOString().split('T')[0];
                    const dayOfWeek = currentDate.getDay();
                    
                    // Skip weekends (0=Sunday, 6=Saturday)
                    if (dayOfWeek === 0 || dayOfWeek === 6) continue;
                    
                    // Check if all users are available on this date
                    const allAvailable = selectedUserIds.every(userId => {
                        return !occupiedDays[userId] || !occupiedDays[userId].has(dateStr);
                    });
                    
                    if (allAvailable) {
                        foundDate = currentDate;
                        break;
                    }
                }
                
                if (foundDate) {
                    const dateThai = formatDateThai(foundDate.toISOString());
                    resultsDiv.innerHTML = `
                        <div class="bg-green-50 border border-green-200 rounded-xl p-4">
                            <div class="flex items-center mb-3">
                                <div class="w-10 h-10 rounded-full bg-green-100 text-green-600 flex items-center justify-center mr-3">
                                    <i class="fas fa-calendar-check"></i>
                                </div>
                                <div>
                                    <h4 class="font-bold text-green-800">พบวันที่ว่างเร็วที่สุด!</h4>
                                    <p class="text-sm text-green-600">${selectedUserIds.length} คนว่างพร้อมกัน</p>
                                </div>
                            </div>
                            <div class="text-center py-4">
                                <p class="text-2xl font-bold text-green-700">${dateThai}</p>
                                <p class="text-sm text-green-600 mt-1">(${foundDate.toISOString().split('T')[0]})</p>
                            </div>
                            <button onclick="createTaskOnDate('${foundDate.toISOString().split('T')[0]}')" 
                                    class="w-full bg-gradient-success text-white py-3 rounded-lg font-bold mt-2">
                                <i class="fas fa-plus mr-2"></i>สร้างงานในวันนี้
                            </button>
                        </div>
                    `;
                } else {
                    resultsDiv.innerHTML = `
                        <div class="bg-yellow-50 border border-yellow-200 rounded-xl p-6 text-center">
                            <i class="fas fa-calendar-times text-yellow-500 text-3xl mb-3"></i>
                            <p class="font-bold text-yellow-700">ไม่พบวันที่ว่างเร็วที่สุด</p>
                            <p class="text-sm text-yellow-600 mt-1">ลองขยายช่วงเวลาหรือลดจำนวนคนดูนะครับ</p>
                        </div>
                    `;
                }
                
            } else if (condition === 'month') {
                // Find all available dates in selected month
                const monthInput = document.getElementById('selected-month').value;
                const [year, month] = monthInput.split('-').map(Number);
                
                const daysInMonth = new Date(year, month, 0).getDate();
                const availableDates = [];
                
                for (let day = 1; day <= daysInMonth; day++) {
                    const date = new Date(year, month - 1, day);
                    const dateStr = date.toISOString().split('T')[0];
                    const dayOfWeek = date.getDay();
                    
                    // Skip weekends
                    if (dayOfWeek === 0 || dayOfWeek === 6) continue;
                    
                    // Check if all users are available
                    const allAvailable = selectedUserIds.every(userId => {
                        return !occupiedDays[userId] || !occupiedDays[userId].has(dateStr);
                    });
                    
                    if (allAvailable) {
                        availableDates.push(date);
                    }
                }
                
                if (availableDates.length > 0) {
                    resultsDiv.innerHTML = `
                        <div class="mb-4">
                            <h4 class="font-bold text-slate-700 mb-2">
                                <i class="far fa-calendar-alt mr-2"></i>พบ ${availableDates.length} วันว่างในเดือน
                            </h4>
                            <div class="grid grid-cols-7 gap-1 text-xs">
                                ${['อา', 'จ', 'อ', 'พ', 'พฤ', 'ศ', 'ส'].map(d => `<div class="text-center py-1 text-slate-500">${d}</div>`).join('')}
                                ${Array.from({length: new Date(year, month-1, 1).getDay()}).map(() => '<div></div>').join('')}
                                ${Array.from({length: daysInMonth}, (_, i) => {
                                    const date = new Date(year, month-1, i+1);
                                    const dateStr = date.toISOString().split('T')[0];
                                    const isAvailable = availableDates.some(d => 
                                        d.toISOString().split('T')[0] === dateStr
                                    );
                                    const isWeekend = date.getDay() === 0 || date.getDay() === 6;
                                    
                                    return `
                                        <div class="text-center py-1">
                                            <div class="w-8 h-8 rounded-full flex items-center justify-center mx-auto
                                                ${isWeekend ? 'bg-slate-100 text-slate-400' : 
                                                  isAvailable ? 'bg-green-100 text-green-700 font-bold cursor-pointer' : 
                                                  'bg-slate-50 text-slate-600'}"
                                                ${isAvailable ? `onclick="createTaskOnDate('${dateStr}')"` : ''}>
                                                ${i+1}
                                            </div>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        </div>
                        <div class="bg-blue-50 border border-blue-200 rounded-xl p-4">
                            <p class="text-sm text-blue-700">
                                <i class="fas fa-info-circle mr-2"></i>
                                คลิกที่วันที่เพื่อสร้างงานในวันนั้นทันที (สีเขียว = ว่างทั้งหมด)
                            </p>
                        </div>
                    `;
                } else {
                    resultsDiv.innerHTML = `
                        <div class="bg-yellow-50 border border-yellow-200 rounded-xl p-6 text-center">
                            <i class="fas fa-calendar-times text-yellow-500 text-3xl mb-3"></i>
                            <p class="font-bold text-yellow-700">ไม่พบวันว่างในเดือนนี้</p>
                            <p class="text-sm text-yellow-600 mt-1">ทุกคนมีงานครบทุกวันทำงานแล้ว</p>
                        </div>
                    `;
                }
            }
            
            showLoading(false);
        }

        async function exportData() {
            showLoading(true);
            
            const startDate = document.getElementById('export-start').value;
            const endDate = document.getElementById('export-end').value;
            const exportType = document.getElementById('export-type').value;
            const format = document.querySelector('input[name="export-format"]:checked').value;
            
            // Fetch data based on criteria
            let data = [];
            let fileName = '';
            
            switch(exportType) {
                case 'tasks':
                    const { data: tasks } = await supabaseClient
                        .from('tasks')
                        .select(`
                            *,
                            trainer:profiles!tasks_trainer_id_fkey(display_name)
                        `)
                        .gte('date', startDate)
                        .lte('date', endDate);
                    
                    data = tasks || [];
                    fileName = `tasks_${startDate}_to_${endDate}`;
                    break;
                    
                case 'users':
                    const { data: users } = await supabaseClient
                        .from('profiles')
                        .select('*');
                    
                    data = users || [];
                    fileName = `users_export`;
                    break;
                    
                case 'statistics':
                    // Generate statistics data
                    const { data: allTasks } = await supabaseClient
                        .from('tasks')
                        .select('*')
                        .gte('date', startDate)
                        .lte('date', endDate);
                    
                    // Calculate statistics
                    const stats = {
                        period: `${startDate} ถึง ${endDate}`,
                        total_tasks: allTasks ? allTasks.length : 0,
                        total_hours: allTasks ? allTasks.reduce((sum, task) => {
                            const start = new Date(`2000-01-01T${task.start_time}`);
                            const end = new Date(`2000-01-01T${task.end_time}`);
                            return sum + (end - start) / 3600000;
                        }, 0) : 0,
                        online_count: allTasks ? allTasks.filter(t => t.format === 'Online').length : 0,
                        f2f_count: allTasks ? allTasks.filter(t => t.format === 'F2F').length : 0
                    };
                    
                    data = [stats];
                    fileName = `statistics_${startDate}_to_${endDate}`;
                    break;
            }
            
            // Export based on format
            if (format === 'excel' || format === 'csv') {
                exportToExcel(data, fileName, format === 'csv');
            } else if (format === 'pdf') {
                exportToPDF(data, fileName);
            }
            
            showLoading(false);
        }

        function exportToExcel(data, fileName, isCSV = false) {
            if (data.length === 0) {
                showNotification('ไม่มีข้อมูลที่จะ export', 'warning');
                return;
            }
            
            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Sheet1");
            
            const fileType = isCSV ? 'csv' : 'xlsx';
            const fileExtension = isCSV ? 'csv' : 'xlsx';
            
            XLSX.writeFile(wb, `${fileName}.${fileExtension}`);
            showNotification(`Export ข้อมูลเป็น ${fileType.toUpperCase()} เรียบร้อยแล้ว`, 'success');
        }

        function exportToPDF(data, fileName) {
            // Simplified PDF export - in production, use a more robust solution
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            
            doc.text(`Export Report: ${fileName}`, 10, 10);
            doc.text(`Generated: ${new Date().toLocaleString('th-TH')}`, 10, 20);
            doc.text(`Total Records: ${data.length}`, 10, 30);
            
            // Add table (simplified)
            let yPos = 40;
            Object.keys(data[0] || {}).forEach((key, index) => {
                doc.text(`${key}:`, 10, yPos);
                yPos += 10;
            });
            
            doc.save(`${fileName}.pdf`);
            showNotification('Export ข้อมูลเป็น PDF เรียบร้อยแล้ว', 'success');
        }

        function quickExport(type) {
            document.getElementById('export-type').value = type;
            document.querySelector('input[name="export-format"][value="excel"]').checked = true;

        async function updateProfile() {
            showLoading(true);

            const displayName = document.getElementById('edit-displayname').value.trim();
            const phone = document.getElementById('edit-phone').value.trim();

                showLoading(false);
                return;
            }
            
            const { error } = await supabaseClient
                .from('profiles')
                .update({
                    full_name: fullName,
                    display_name: displayName,
                    phone: phone,
                    updated_at: new Date().toISOString()
                })
                .eq('id', authUser.id);
            
            if (error) {
                showNotification('เกิดข้อผิดพลาดในการอัพเดทโปรไฟล์', 'error');
                console.error(error);
            } else {
                showNotification('อัพเดทโปรไฟล์เรียบร้อยแล้ว', 'success');
                // Reload profile data
                const { data: p } = await supabaseClient
                    .from('profiles')
                    .select('*')
                    .eq('id', authUser.id)
                    .single();
                
                if (p) {
                    profile = p;
                    document.getElementById('user-display-name').textContent = p.display_name;

        async function changePassword() {
            showLoading(true);
            
            const currentPassword = document.getElementById('current-password').value;
            const newPassword = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            
            // Validation
            if (!currentPassword || !newPassword || !confirmPassword) {
                showNotification('กรุณากรอกรหัสผ่านทั้งหมด', 'error');
                showLoading(false);
                return;
            }
            
            if (newPassword !== confirmPassword) {
                showNotification('รหัสผ่านใหม่ไม่ตรงกัน', 'error');
                showLoading(false);
                return;
            }
            
            if (newPassword.length < 8) {
                showNotification('รหัสผ่านใหม่ต้องมีอย่างน้อย 8 ตัวอักษร', 'error');
                showLoading(false);
                return;
            }
            
            try {
                // First, verify current password by trying to reauthenticate
                const { error: signInError } = await supabaseClient.auth.signInWithPassword({
                    email: authUser.email,
                    password: currentPassword
                });
                
                if (signInError) {
                    showNotification('รหัสผ่านเดิมไม่ถูกต้อง', 'error');
                    showLoading(false);
                    return;
                }
                
                // Update password
                const { error: updateError } = await supabaseClient.auth.updateUser({
                    password: newPassword
                });
                
                if (updateError) throw updateError;
                
                showNotification('เปลี่ยนรหัสผ่านเรียบร้อยแล้ว', 'success');
                
                // Clear password fields
                document.getElementById('current-password').value = '';
                document.getElementById('new-password').value = '';
                document.getElementById('confirm-password').value = '';
                
            } catch (error) {
                showNotification('เกิดข้อผิดพลาดในการเปลี่ยนรหัสผ่าน', 'error');
                console.error(error);
            }
            
            showLoading(false);
        }

        async function createNewUser() {
            showLoading(true);
            
            const email = document.getElementById('new-user-email').value.trim();
            const password = document.getElementById('new-user-password').value;
            const fullName = document.getElementById('new-user-fullname').value.trim();
            const displayName = document.getElementById('new-user-displayname').value.trim();
            const role = document.getElementById('new-user-role').value;
            
            // Validation

                showNotification('กรุณากรอกข้อมูลให้ครบถ้วน', 'error');
                showLoading(false);
                return;

            if (password.length < 6) {
                showNotification('รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร', 'error');
                showLoading(false);
                return;
            }
            
            try {
                // Create user in Supabase Auth
                const { data: authData, error: authError } = await supabaseClient.auth.signUp({
                    email: email,
                    password: password,
                    options: {
                        data: {
                            full_name: fullName,
                            display_name: displayName
                        }
                    }
                });
                
                if (authError) throw authError;
                
                // Create profile in profiles table
                const { error: profileError } = await supabaseClient
                    .from('profiles')
                    .insert({
                        id: authData.user.id,
                        email: email,
                        full_name: fullName,
                        display_name: displayName,
                        role: role,
                        created_at: new Date().toISOString()
                    });

        async function checkDateConflict() {
            const date = document.getElementById('task-date').value;
            const trainerId = profile.role === 'trainer' ? authUser.id : document.getElementById('task-trainer').value;
            
            if (!date || !trainerId) return;
            
            const { data: existingTasks } = await supabaseClient
                .from('tasks')
                .select('*')
                .eq('date', date)
                .eq('trainer_id', trainerId);
            
            if (existingTasks && existingTasks.length > 0) {
                showWarning('วันที่นี้มีงานอื่นอยู่แล้ว กรุณาตรวจสอบความเหมาะสม');
            }
        }

        async function checkTimeConflict() {
            const date = document.getElementById('task-date').value;
            const start = document.getElementById('task-start').value;
            const end = document.getElementById('task-end').value;
            const trainerId = profile.role === 'trainer' ? authUser.id : document.getElementById('task-trainer').value;
            
            if (!date || !start || !end || !trainerId) return;
            
            const { data: existingTasks } = await supabaseClient
                .from('tasks')
                .select('*')
                .eq('date', date)
                .eq('trainer_id', trainerId);
            
            if (existingTasks && existingTasks.length > 0) {
                // Check for exact time conflict
                const hasConflict = existingTasks.some(task => {
                    return (start >= task.start_time && start < task.end_time) ||
                           (end > task.start_time && end <= task.end_time) ||
                           (start <= task.start_time && end >= task.end_time);
                });
                
                if (hasConflict) {
                    showError('มีงานอื่นในเวลาเดียวกัน ไม่สามารถบันทึกได้');
                } else {
                    showWarning('มีงานอื่นในวันนี้ กรุณาตรวจสอบความสะดวก');
                }
            }
        }

        async function createTask() {
            showLoading(true);
            
            const isLeave = document.getElementById('is-leave').checked;
            const leaveType = document.querySelector('input[name="leave-type"]:checked')?.value;
            
            if (isLeave && !leaveType) {
                showNotification('กรุณาเลือกประเภทวันลา', 'error');
                showLoading(false);
                return;
            }
            
            // Gather form data
            const taskData = {
                date: document.getElementById('task-date').value,
                start_time: document.getElementById('task-start').value,
                end_time: document.getElementById('task-end').value,
                audience: document.getElementById('task-audience').value,
                format: document.querySelector('input[name="task-format"]:checked')?.value,
                course_details: document.getElementById('task-details').value,
                location: document.getElementById('task-location').value,
                is_leave: isLeave,
                leave_type: leaveType,
                created_by: authUser.id,
                created_at: new Date().toISOString()
            };
            
            // Handle trainer selection based on role
            if (profile.role === 'trainer') {
                taskData.trainer_id = authUser.id;
            } else {
                const trainerSelect = document.getElementById('task-trainer');
                const selectedTrainers = Array.from(trainerSelect.selectedOptions).map(opt => opt.value);
                
                if (selectedTrainers.length === 0) {
                    showNotification('กรุณาเลือกเทรนเนอร์อย่างน้อย 1 คน', 'error');
                    showLoading(false);
                    return;
                }
                
                if (selectedTrainers.length === 1) {
                    taskData.trainer_id = selectedTrainers[0];
                } else {
                    // For multiple trainers, we need to create multiple tasks
                    // This is simplified - in production you might want a different approach
                    taskData.trainer_ids = selectedTrainers;
                }
            }
            
            // Validate required fields
            if (!isLeave) {
                if (!taskData.date || !taskData.start_time || !taskData.end_time || 
                    !taskData.audience || !taskData.format) {
                    showNotification('กรุณากรอกข้อมูลให้ครบถ้วน', 'error');
                    showLoading(false);
                    return;
                }
                
                // Validate time
                if (taskData.start_time >= taskData.end_time) {
                    showNotification('เวลาเริ่มต้องมาก่อนเวลาจบ', 'error');
                    showLoading(false);
                    return;
                }
            }
            
            try {
                let result;
                
                if (taskData.trainer_ids && taskData.trainer_ids.length > 1) {
                    // Create multiple tasks for multiple trainers
                    const tasks = taskData.trainer_ids.map(trainerId => ({
                        ...taskData,
                        trainer_id: trainerId,
                        trainer_ids: null // Remove the array for single task
                    }));
                    
                    // Insert all tasks
                    const { data, error } = await supabaseClient
                        .from('tasks')
                        .insert(tasks);
                    
                    result = { data, error };
                } else {
                    // Create single task
                    const { data, error } = await supabaseClient
                        .from('tasks')
                        .insert([taskData]);
                    
                    result = { data, error };
                }
                
                if (result.error) throw result.error;
                
                showNotification('สร้างงานเรียบร้อยแล้ว', 'success');
                
                // Clear form
                if (!isLeave) {
                    document.getElementById('task-details').value = '';
                    document.getElementById('task-location').value = '';
                }
                
                // Refresh data
                await loadAllTasks();
                
                // Redirect to calendar
                renderCalendar();
                
            } catch (error) {
                console.error('Error creating task:', error);
                showNotification('เกิดข้อผิดพลาดในการสร้างงาน: ' + error.message, 'error');
            }
            
            showLoading(false);
        }

            // Check permission
            if (task.trainer_id !== authUser.id && profile.role !== 'admin' && profile.role !== 'master') {
                showNotification('คุณไม่มีสิทธิ์แก้ไขงานนี้', 'error');
                return;
            }
            
            // Set form values for editing
            localStorage.setItem('editingTaskId', taskId);
            localStorage.setItem('editingTask', JSON.stringify(task));
            
            // Redirect to create task form with edit mode
            renderCreateTask();
            
            // After form loads, fill with task data
            setTimeout(() => {
                if (task.is_leave) {
                    document.getElementById('is-leave').checked = true;
                    toggleLeaveMode();
                    document.querySelector(`input[name="leave-type"][value="${task.leave_type}"]`).checked = true;
                }
                
                document.getElementById('task-date').value = task.date;
                document.getElementById('task-start').value = task.start_time;
                document.getElementById('task-end').value = task.end_time;
                document.getElementById('task-audience').value = task.audience;
                document.querySelector(`input[name="task-format"][value="${task.format}"]`).checked = true;
                document.getElementById('task-details').value = task.course_details || '';
                document.getElementById('task-location').value = task.location || '';
                
                if (profile.role !== 'trainer') {
                    const trainerSelect = document.getElementById('task-trainer');
                    const option = Array.from(trainerSelect.options).find(opt => opt.value === task.trainer_id);
                    if (option) option.selected = true;
                }
                
                // Change button to update
                const createBtn = document.querySelector('button[onclick="createTask()"]');
                createBtn.innerHTML = '<i class="fas fa-save mr-2"></i>อัพเดทงาน';
                createBtn.setAttribute('onclick', 'updateTask()');
                
                updateTaskPreview();
            }, 500);
        }

        async function updateTask() {
            const taskId = localStorage.getItem('editingTaskId');
            if (!taskId) return;
            
            showLoading(true);
            
            // Gather updated data (similar to createTask)
            const taskData = {
                date: document.getElementById('task-date').value,
                start_time: document.getElementById('task-start').value,
                end_time: document.getElementById('task-end').value,
                audience: document.getElementById('task-audience').value,
                format: document.querySelector('input[name="task-format"]:checked')?.value,
                course_details: document.getElementById('task-details').value,
                location: document.getElementById('task-location').value,
                updated_at: new Date().toISOString()
            };
            
            // Handle trainer if admin/master
            if (profile.role !== 'trainer') {
                const trainerSelect = document.getElementById('task-trainer');
                const selectedTrainers = Array.from(trainerSelect.selectedOptions).map(opt => opt.value);
                if (selectedTrainers.length === 1) {
                    taskData.trainer_id = selectedTrainers[0];
                }
            }
            
            try {
                const { error } = await supabaseClient
                    .from('tasks')
                    .update(taskData)
                    .eq('id', taskId);
                
                if (error) throw error;
                
                showNotification('อัพเดทงานเรียบร้อยแล้ว', 'success');
                
                // Clear editing state
                localStorage.removeItem('editingTaskId');
                localStorage.removeItem('editingTask');
                
                // Refresh data and return to calendar
                await loadAllTasks();
                renderCalendar();
                
            } catch (error) {
                console.error('Error updating task:', error);
                showNotification('เกิดข้อผิดพลาดในการอัพเดทงาน: ' + error.message, 'error');
            }
            
            showLoading(false);
        }

        async function deleteTask(taskId) {
            // Get task to check permissions
            const { data: task } = await supabaseClient
                .from('tasks')
                .select('*')
                .eq('id', taskId)
                .single();
            
            if (!task) return;
            
            // Check permission
            if (task.trainer_id !== authUser.id && profile.role !== 'admin' && profile.role !== 'master') {
                showNotification('คุณไม่มีสิทธิ์ลบงานนี้', 'error');
                return;
            }
            
            showModal(
                'ลบงาน',
                `คุณแน่ใจหรือไม่ที่จะลบงาน "${task.course_details || 'งานนี้'}"?\nการกระทำนี้ไม่สามารถย้อนกลับได้`,
                async () => {
                    showLoading(true);
                    
                    try {
                        const { error } = await supabaseClient
                            .from('tasks')
                            .delete()
                            .eq('id', taskId);
                        
                        if (error) throw error;
                        
                        showNotification('ลบงานเรียบร้อยแล้ว', 'success');
                        
                        // Refresh data
                        await loadAllTasks();
                        
                        // Refresh current view
                        if (calendar) {
                            calendar.refetchEvents();
                            renderTaskList();
                        } else if (document.getElementById('main-content').innerHTML.includes('รายละเอียดงาน')) {
                            hideTaskModal();
                        }
                        
                    } catch (error) {
                        console.error('Error deleting task:', error);
                        showNotification('เกิดข้อผิดพลาดในการลบงาน: ' + error.message, 'error');
                    }
                    
                    showLoading(false);
                }
            );
        }

        async function addComment(taskId) {
            const commentInput = document.getElementById('new-comment');
            const comment = commentInput.value.trim();
            
            if (!comment) {
                showNotification('กรุณากรอกความคิดเห็น', 'error');
                return;
            }
            
            showLoading(true);
            
            try {
                // Get existing comments
                const { data: task } = await supabaseClient
                    .from('tasks')
                    .select('comments')
                    .eq('id', taskId)
                    .single();
                
                const comments = task.comments || [];
                const newComment = {
                    user_id: authUser.id,
                    user_name: profile.display_name,
                    comment: comment,
                    created_at: new Date().toISOString()
                };
                
                comments.push(newComment);
                
                const { error } = await supabaseClient
                    .from('tasks')
                    .update({ comments: comments })
                    .eq('id', taskId);
                
                if (error) throw error;
                
                showNotification('เพิ่มความคิดเห็นเรียบร้อยแล้ว', 'success');
                commentInput.value = '';
                
                // Refresh task view
                await viewTaskDetail(taskId);
                
            } catch (error) {
                console.error('Error adding comment:', error);
                showNotification('เกิดข้อผิดพลาดในการเพิ่มความคิดเห็น', 'error');
            }
            
            showLoading(false);
        }

        // ==================== HELPER FUNCTIONS ====================
        function getAudienceColor(audience) {
            switch(audience) {
                case 'ttb': return 'audience-ttb';
                case 'PD ttb': return 'audience-pd';
                case 'PRU': return 'audience-pru';
                case 'Customer': return 'audience-customer';
                case 'Other': return 'audience-other';
                default: return 'audience-other';
            }
        }

        function getAudienceColorHex(audience) {
            switch(audience) {
                case 'ttb': return '#3b82f6';
                case 'PD ttb': return '#10b981';
                case 'PRU': return '#8b5cf6';
                case 'Customer': return '#f59e0b';
                case 'Other': return '#6b7280';
                default: return '#6b7280';
            }
        }

        // ==================== INITIALIZATION ====================
        async function checkSession() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                await loadAppData(session.user);
            }
        }

        // Initialize on load
        window.onload = checkSession;

        // Handle browser back/forward
        window.onpopstate = function(event) {
            // You can implement navigation history here if needed
        };

        // Prevent accidental refresh
        window.onbeforeunload = function(event) {
            // Optional: Warn user about unsaved changes
        };

        // Add active class to navigation buttons
        document.addEventListener('click', function(e) {
            if (e.target.closest('.nav-btn')) {
                document.querySelectorAll('.nav-btn').forEach(btn => {
                    btn.classList.remove('text-blue-600');
                    btn.classList.add('text-slate-400');
                });
                e.target.closest('.nav-btn').classList.add('text-blue-600');
                e.target.closest('.nav-btn').classList.remove('text-slate-400');
            }
        });

        // Initialize with home active
        setTimeout(() => {
            document.querySelector('.nav-btn')?.classList.add('text-blue-600');
            document.querySelector('.nav-btn')?.classList.remove('text-slate-400');
        }, 1000);

    </script>
