        :root {
            --primary: #4F46E5;

            --accent: #F59E0B;

            --background: #F8FAFC;

            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            --radius-sm: 0.375rem;
            --radius: 0.75rem;
            --radius-lg: 1rem;
            --radius-xl: 1.5rem;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background-color: var(--background);
            color: var(--text-primary);
            line-height: 1.6;
        }

        /* Modern Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #F1F5F9;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #CBD5E1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94A3B8;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes slideIn {
            from { transform: translateX(-20px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .animate-fade-in {
            animation: fadeIn 0.6s ease-out forwards;
        }
        .animate-slide-in {
            animation: slideIn 0.5s ease-out forwards;
        }
        .animate-pulse-slow {
            animation: pulse 2s ease-in-out infinite;
        }
        .animate-float {
            animation: float 3s ease-in-out infinite;
        }

        /* Glassmorphism Effects */
        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .glass-dark {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Gradient Backgrounds */
        .gradient-primary {
            background: linear-gradient(135deg, #667EEA 0%, #764BA2 100%);
        }
        .gradient-success {
            background: linear-gradient(135deg, #10B981 0%, #34D399 100%);
        }
        .gradient-warning {
            background: linear-gradient(135deg, #F59E0B 0%, #FBBF24 100%);
        }
        .gradient-info {
            background: linear-gradient(135deg, #3B82F6 0%, #60A5FA 100%);
        }

        /* Custom Classes */
        .text-gradient {
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .hover-lift {
            transition: all 0.3s ease;
        }
        .hover-lift:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
        }
        .card-hover {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .card-hover:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-xl);
        }
        .highlight-shadow {
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        }
        .neumorphic {
            background: var(--surface);
            border-radius: var(--radius);
            box-shadow: 5px 5px 10px #d1d9e6, -5px -5px 10px #ffffff;
        }

        /* Smooth Transitions */
        .transition-all-smooth {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>
</head>

                    </aside>

                    {/* Main Content */}
                    <div className="flex-1 flex flex-col min-w-0 lg:ml-0">
                        {/* Mobile Header */}
                        <header className="lg:hidden h-16 bg-white/80 backdrop-blur-sm border-b border-slate-200 px-6 flex items-center justify-between sticky top-0 z-30">
                            <div className="flex items-center gap-3">
                                <button onClick={() => setIsSidebarOpen(!isSidebarOpen)}>
                                    <MenuIcon className="w-6 h-6 text-slate-700" />
                                </button>
                                <h1 className="font-bold text-slate-900">Training Portal</h1>
                            </div>
                            <div className="flex items-center gap-3">
                                <BellIcon className="w-5 h-5 text-slate-600" />
                                <UserInitial name={currentUser.name} size="sm" />
                            </div>
                        </header>
                        
                        {/* Main Content Area */}
                        <main className="flex-1 overflow-y-auto p-6 lg:p-8">
                            {view === 'dashboard' && <DashboardView />}
                            {view === 'schedule' && <ScheduleView />}
                            {view === 'calendar' && <CalendarView />}
                            {view === 'trainerView' && <TrainerView />}
                            {view === 'reports' && (
                                <div className="max-w-7xl mx-auto">
                                    <div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-8">
                                        <h2 className="text-2xl font-bold text-slate-900 mb-2">Analytics & Reports</h2>
                                        <p className="text-slate-600 mb-8">Comprehensive analytics dashboard coming soon...</p>
                                        <div className="bg-gradient-to-br from-slate-50 to-white border-2 border-dashed border-slate-300 rounded-2xl p-12 text-center">
                                            <div className="w-16 h-16 bg-gradient-to-br from-indigo-100 to-purple-100 rounded-2xl flex items-center justify-center mx-auto mb-4">
                                                <ChartIcon className="w-8 h-8 text-indigo-600" />
                                            </div>
                                            <h3 className="text-xl font-bold text-slate-900 mb-2">Advanced Analytics</h3>
                                            <p className="text-slate-600 max-w-md mx-auto">
                                                Detailed reports, performance metrics, and data visualizations will be available here in the next update.
                                            </p>
                                        </div>
                                    </div>
                                </div>
                            )}
                        </main>
                    </div>

                    <Modal />

                    {/* Background Overlay for Mobile Sidebar */}
                    {isSidebarOpen && (
                        <div 
                            className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-30 lg:hidden"
                            onClick={() => setIsSidebarOpen(false)}
                        ></div>
                    )}
                </div>
            );
        }

        // Render the app
        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
