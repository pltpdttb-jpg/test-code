<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ttb trainer task</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        body { background-color: #f8fafc; font-family: 'Prompt', sans-serif; -webkit-tap-highlight-color: transparent; }
        .bg-gradient-primary { background: linear-gradient(135deg, #002d63 0%, #0056b3 100%); }
        .mobile-container { max-width: 480px; margin: 0 auto; min-height: 100vh; background-color: white; padding-bottom: 80px; position: relative; box-shadow: 0 0 20px rgba(0,0,0,0.05); }
        .input-rounded { border-radius: 12px; border: 1px solid #e2e8f0; transition: all 0.2s; }
        .input-rounded:focus { border-color: #0056b3; box-shadow: 0 0 0 3px rgba(0, 86, 179, 0.1); outline: none; }
        .loader { border: 3px solid #f3f3f3; border-radius: 50%; border-top: 3px solid #002d63; width: 24px; height: 24px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <script>
        const SUPABASE_URL = 'https://zmkwjxgsfjipqlrchjtd.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inpta3dqeGdzZmppcHFscmNoanRkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjkxMDgyMzUsImV4cCI6MjA4NDY4NDIzNX0.P_kxe7Titme5ftHjhRtyON5t6EvM44wmX8to5_u7Ppw';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    </script>

    <!-- LOGIN SCREEN -->
    <div id="login-screen" class="mobile-container flex flex-col justify-center items-center p-8 bg-white absolute inset-0 z-50">
        <div class="w-20 h-20 rounded-2xl bg-gradient-primary flex items-center justify-center text-white font-bold text-3xl shadow-lg mb-6">TS</div>
        <h2 class="text-2xl font-bold text-slate-800 mb-1">ttb trainer task</h2>
        <p class="text-slate-400 text-sm mb-8">เข้าใช้งานด้วย Email หรือ User ID</p>

        <form id="login-form" class="w-full space-y-4">
            <div>
                <label class="block text-xs font-medium text-slate-500 mb-1 ml-1">Email / User ID</label>
                <input type="text" id="login-id" required class="input-rounded w-full px-4 py-3 bg-slate-50 text-sm" placeholder="เช่น ttb.yc หรือ email@ttb.com">
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-500 mb-1 ml-1">Password (6 หลักขึ้นไป)</label>
                <input type="password" id="login-password" required class="input-rounded w-full px-4 py-3 bg-slate-50 text-sm" placeholder="••••••••">
            </div>
            <button type="submit" class="w-full bg-gradient-primary text-white font-semibold py-3.5 rounded-xl shadow-md active:scale-95 transition-transform mt-2">
                เข้าสู่ระบบ
            </button>
            <div id="login-error" class="text-red-500 text-xs text-center hidden mt-2 p-2 bg-red-50 rounded-lg"></div>
        </form>
    </div>

    <!-- APP CONTAINER -->
    <div id="app" class="mobile-container hidden">
        <header class="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-slate-100 px-5 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 rounded-xl bg-gradient-primary flex items-center justify-center text-white text-sm"><i class="fa-solid fa-user-tie"></i></div>
                <div>
                    <h1 id="user-display-name" class="font-bold text-sm text-slate-800">...</h1>
                    <div id="user-role-badge" class="text-[10px] text-blue-600 font-medium">Loading...</div>
                </div>
            </div>
            <button onclick="handleLogout()" class="text-slate-300 hover:text-red-500"><i class="fa-solid fa-power-off"></i></button>
        </header>

        <main id="main-content" class="p-5 space-y-6">
            <!-- Dynamic Content -->
        </main>

        <!-- Bottom Nav -->
        <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-100 px-2 py-2 z-50 max-w-[480px] mx-auto flex justify-around">
            <button onclick="renderDashboard()" class="flex flex-col items-center gap-1 p-2"><i class="fa-solid fa-house"></i><span class="text-[10px]">Home</span></button>
            <button onclick="renderSchedules()" class="flex flex-col items-center gap-1 p-2"><i class="fa-solid fa-calendar-alt"></i><span class="text-[10px]">ตาราง</span></button>
            <button onclick="renderCreate()" class="flex flex-col items-center gap-1 p-2 text-blue-600"><i class="fa-solid fa-plus-circle text-2xl"></i></button>
            <button onclick="renderAvailability()" class="flex flex-col items-center gap-1 p-2"><i class="fa-solid fa-search"></i><span class="text-[10px]">วันว่าง</span></button>
            <button onclick="renderProfile()" class="flex flex-col items-center gap-1 p-2"><i class="fa-solid fa-user"></i><span class="text-[10px]">ฉัน</span></button>
        </nav>
    </div>

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="fixed inset-0 bg-white/80 backdrop-blur-sm z-[60] flex items-center justify-center hidden">
        <div class="loader"></div>
    </div>

    <script>
        let currentUser = null;
        let userProfile = null;
        let allSchedules = [];

        async function init() {
            showLoading(true);
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                await loadAppData(session.user);
            } else {
                showLoading(false);
            }
        }

        async function loadAppData(user) {
            currentUser = user;
            const { data: profile } = await supabaseClient.from('profiles').select('*').eq('id', user.id).single();
            userProfile = profile;
            
            document.getElementById('user-display-name').textContent = profile.display_name;
            document.getElementById('user-role-badge').textContent = `${profile.team} | ${profile.role}`;
            
            await refreshSchedules();
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('app').classList.remove('hidden');
            renderDashboard();
            showLoading(false);
        }

        async function handleLogin(e) {
            e.preventDefault();
            showLoading(true);
            const loginId = document.getElementById('login-id').value.trim();
            const password = document.getElementById('login-password').value;
            const errDiv = document.getElementById('login-error');
            errDiv.classList.add('hidden');

            try {
                let email = loginId;
                // ถ้าไม่ใช่ Email (ไม่มี @) ให้ไปหาจากตาราง profiles
                if (!loginId.includes('@')) {
                    const { data: p, error: pErr } = await supabaseClient
                        .from('profiles')
                        .select('email')
                        .eq('user_id_code', loginId)
                        .single();
                    if (pErr || !p) throw new Error('ไม่พบ User ID นี้ในระบบ');
                    email = p.email;
                }

                const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
                if (error) throw error;
                await loadAppData(data.user);
            } catch (err) {
                errDiv.textContent = err.message === 'Invalid login credentials' ? 'รหัสผ่านไม่ถูกต้อง (ต้อง 6 ตัวขึ้นไป)' : err.message;
                errDiv.classList.remove('hidden');
            } finally {
                showLoading(false);
            }
        }

        async function refreshSchedules() {
            const { data } = await supabaseClient.from('schedules').select('*, profiles(display_name)').order('date', {ascending: true});
            allSchedules = data || [];
        }

        function renderDashboard() {
            const container = document.getElementById('main-content');
            const today = new Date().toISOString().split('T')[0];
            const todayTasks = allSchedules.filter(s => s.date === today && (userProfile.role !== 'Trainer' || s.trainer_id === currentUser.id));
            
            container.innerHTML = `
                <div class="bg-gradient-primary rounded-2xl p-6 text-white shadow-lg mb-4">
                    <p class="text-xs opacity-80">ตารางวันนี้</p>
                    <h2 class="text-2xl font-bold">${todayTasks.length} งาน</h2>
                </div>
                <h3 class="font-bold text-slate-700 mb-2">งานที่รอมอบหมาย</h3>
                <div class="space-y-3">
                    ${todayTasks.length ? todayTasks.map(t => `<div class="p-4 bg-white rounded-xl shadow-sm border border-slate-100">
                        <div class="flex justify-between text-xs mb-1"><span class="font-bold text-blue-600">${t.start_time.slice(0,5)} น.</span> <span class="text-slate-400">${t.audience}</span></div>
                        <div class="font-bold text-sm">${t.course_detail}</div>
                        <div class="text-[10px] text-slate-400 mt-1"><i class="fa-solid fa-location-dot mr-1"></i> ${t.location}</div>
                    </div>`).join('') : '<p class="text-xs text-slate-400 text-center py-8">วันนี้ยังไม่มีงาน</p>'}
                </div>
            `;
        }

        function renderCreate() {
            const container = document.getElementById('main-content');
            container.innerHTML = `
                <h2 class="text-xl font-bold mb-4">ลงตารางงานใหม่</h2>
                <form id="create-form" class="space-y-4 bg-white p-5 rounded-2xl shadow-sm border">
                    <div id="conflict-msg" class="hidden p-3 bg-red-100 text-red-700 text-xs rounded-lg font-bold"></div>
                    <div>
                        <label class="block text-xs font-medium text-slate-500 mb-1">วันที่</label>
                        <input type="date" id="c-date" required class="input-rounded w-full px-4 py-3 text-sm">
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div><label class="block text-xs font-medium text-slate-500 mb-1">เริ่ม</label><input type="time" id="c-start" required class="input-rounded w-full px-3 py-3 text-sm"></div>
                        <div><label class="block text-xs font-medium text-slate-500 mb-1">ถึง</label><input type="time" id="c-end" required class="input-rounded w-full px-3 py-3 text-sm"></div>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-500 mb-1">รายละเอียดหลักสูตร</label>
                        <input type="text" id="c-detail" required class="input-rounded w-full px-4 py-3 text-sm" placeholder="เช่น Product Training">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-500 mb-1">สถานที่ / ลิงก์</label>
                        <input type="text" id="c-location" required class="input-rounded w-full px-4 py-3 text-sm" placeholder="ห้องประชุม หรือ Online">
                    </div>
                    <button type="submit" class="w-full bg-blue-600 text-white font-bold py-4 rounded-xl shadow-md">บันทึกงาน</button>
                </form>
            `;

            document.getElementById('create-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const msg = document.getElementById('conflict-msg');
                msg.classList.add('hidden');
                showLoading(true);

                const date = document.getElementById('c-date').value;
                const start = document.getElementById('c-start').value;
                const end = document.getElementById('c-end').value;

                // --- 🚩 CHECK CONFLICT (ตรวจสอบความว่าง) ---
                const hasConflict = allSchedules.some(s => 
                    s.trainer_id === currentUser.id && 
                    s.date === date && 
                    ((start >= s.start_time && start < s.end_time) || (end > s.start_time && end <= s.end_time))
                );

                if (hasConflict) {
                    msg.textContent = "❌ ไม่สามารถลงงานได้: คุณมีงานอื่นในช่วงเวลานี้แล้ว";
                    msg.classList.remove('hidden');
                    showLoading(false);
                    return;
                }

                // --- SAVE DATA ---
                const { error } = await supabaseClient.from('schedules').insert([{
                    date, start_time: start, end_time: end, 
                    course_detail: document.getElementById('c-detail').value,
                    location: document.getElementById('c-location').value,
                    trainer_id: currentUser.id,
                    team_group: userProfile.team,
                    audience: 'ttb' // Default
                }]);

                if (error) { alert(error.message); showLoading(false); }
                else { await refreshSchedules(); renderDashboard(); showLoading(false); }
            });
        }

        // Dummy/Placeholder for other views
        function renderSchedules() { document.getElementById('main-content').innerHTML = '<h2 class="font-bold">ตารางงานทั้งหมด</h2><p class="text-xs text-slate-400 mt-4">กำลังพัฒนาระบบตัวกรอง...</p>'; }
        function renderAvailability() { document.getElementById('main-content').innerHTML = '<h2 class="font-bold">ค้นหาวันว่าง</h2>'; }
        function renderProfile() { document.getElementById('main-content').innerHTML = '<h2 class="font-bold">โปรไฟล์</h2><button onclick="handleLogout()" class="mt-4 p-3 bg-red-100 text-red-600 rounded-xl text-sm w-full font-bold">ออกจากระบบ</button>'; }

        function showLoading(s) { document.getElementById('loading-overlay').classList.toggle('hidden', !s); }
        async function handleLogout() { await supabaseClient.auth.signOut(); window.location.reload(); }
        
        document.getElementById('login-form').addEventListener('submit', handleLogin);
        window.onload = init;
    </script>
</body>
</html>
