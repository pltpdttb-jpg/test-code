<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Training Portal 2026</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css">
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .animate-fade-in { animation: fadeIn 0.5s ease-out forwards; }
        .animate-slide-up { animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        .icon { width: 20px; height: 20px; }
        .icon-lg { width: 24px; height: 24px; }
        .icon-xl { width: 28px; height: 28px; }
    </style>
</head>
<body class="bg-gray-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;

        // Icons Components (simplified versions)
        const CalendarIcon = () => <svg className="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>;
        const DashboardIcon = () => <svg className="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>;
        const ListIcon = () => <svg className="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3" y2="6"/><line x1="3" y1="12" x2="3" y2="12"/><line x1="3" y1="18" x2="3" y2="18"/></svg>;
        const UserIcon = () => <svg className="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>;
        const ChartIcon = () => <svg className="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>;
        const LogoutIcon = () => <svg className="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>;
        const SearchIcon = () => <svg className="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>;
        const PlusIcon = () => <svg className="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>;
        const CheckIcon = () => <svg className="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>;
        const ClockIcon = () => <svg className="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>;
        const ChevronLeft = () => <svg className="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="15 18 9 12 15 6"/></svg>;
        const ChevronRight = () => <svg className="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="9 18 15 12 9 6"/></svg>;
        const MapPinIcon = () => <svg className="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>;
        const FileIcon = () => <svg className="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>;
        const AlertIcon = () => <svg className="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12" y2="16"/></svg>;
        const MenuIcon = () => <svg className="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>;
        const XIcon = () => <svg className="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>;
        const DownloadIcon = () => <svg className="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>;
        const TargetIcon = () => <svg className="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>;
        const TrendingIcon = () => <svg className="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>;
        const AwardIcon = () => <svg className="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/></svg>;
        const LockIcon = () => <svg className="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>;
        const HomeIcon = () => <svg className="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>;

        // INITIAL DATA
        const INITIAL_USERS = [
            { id: 'u1', name: 'Pachara', role: 'Main Trainer (Admin)', isAdmin: true },
            { id: 'u2', name: 'Yannapat', role: 'Main Trainer (Admin)', isAdmin: true },
            { id: 'u3', name: 'Thanayot', role: 'Main Trainer (Admin)', isAdmin: true },
            { id: 'u4', name: 'Ananya', role: 'Main Trainer (Admin)', isAdmin: true },
            { id: 'u5', name: 'Natkanit', role: 'Trainer', isAdmin: false },
            { id: 'u6', name: 'Patchareeya', role: 'Trainer', isAdmin: false },
        ];

        const INITIAL_TRAININGS = [
            { id: 1, date: '2026-01-12', endDate: '2026-01-12', course: 'KASH school 2', segment: 'High & Sniper', zone: 'จตุจักร', rh: 'RH 1', location: 'Jubilee Prestige รัชดา', trainers: ['Pachara', 'Natkanit'], status: 'Completed', confirmed: true, attendees: 25 },
            { id: 2, date: '2026-01-16', endDate: '2026-01-16', course: 'KASH school 2', segment: 'High & Sniper', zone: 'ธนบุรี', rh: 'RH 1', location: 'Jubilee Prestige รัชดา', trainers: ['Pachara', 'Natkanit'], status: 'Completed', confirmed: true, attendees: 22 },
            { id: 3, date: '2026-02-02', endDate: '2026-02-02', course: 'KASH school 2', segment: 'High & Sniper', zone: 'สุขุมวิท', rh: 'RH 1', location: 'Jubilee Prestige รัชดา', trainers: ['Natkanit', 'Patchareeya'], status: 'Completed', confirmed: true, attendees: 24 },
            { id: 4, date: '2026-02-09', endDate: '2026-02-09', course: 'Mama 1', segment: 'Low & Medium', zone: '-', rh: '-', location: 'Jubilee Prestige รัชดา', trainers: ['Pachara', 'Saowanee'], status: 'Completed', confirmed: true, attendees: 18 },
            { id: 5, date: '2026-02-16', endDate: '2026-02-16', course: 'KASH school 1', segment: 'Low & Medium', zone: 'ชลบุรี', rh: 'RH 2', location: 'โรงแรมรัตนชล', trainers: ['Pachara', 'Saowanee'], status: 'Planned', confirmed: false, attendees: 0 },
        ];

        const COURSE_GROUPS = [
            { name: 'KASH School', courses: ['KASH school 1', 'KASH school 2'], color: 'bg-indigo-600', lightColor: 'bg-indigo-100', text: 'text-indigo-600' },
            { name: 'Ramen', courses: ['Ramen 1', 'Ramen 2'], color: 'bg-rose-500', lightColor: 'bg-rose-100', text: 'text-rose-500' },
            { name: 'Mama', courses: ['Mama 1', 'Mama 2'], color: 'bg-orange-500', lightColor: 'bg-orange-100', text: 'text-orange-500' }
        ];

        const COURSES = ['KASH school 1', 'KASH school 2', 'Ramen 1', 'Ramen 2', 'Mama 1', 'Mama 2'];
        const RHS = ['RH 1', 'RH 2', 'RH 3', 'RH 4', 'RH 5'];
        const SEGMENTS = ['High & Sniper', 'Low & Medium'];
        const ZONES = ['จตุจักร', 'ธนบุรี', 'บางกะปิ', 'สาทร', 'สุขุมวิท', 'บางนา', 'นนทบุรี', 'ชลบุรี'];

        // UTILS
        const getPasscode = (name) => {
            return `ttb${name.substring(0, 3).toLowerCase()}`;
        };

        // COMPONENTS
        const StatusBadge = ({ status }) => {
            const styles = {
                Planned: 'bg-blue-50 text-blue-700 border border-blue-100',
                Confirmed: 'bg-yellow-50 text-yellow-700 border border-yellow-100',
                Completed: 'bg-green-50 text-green-700 border border-green-100',
                Cancelled: 'bg-red-50 text-red-700 border border-red-100',
            };
            return (
                <span className={`px-2.5 py-0.5 rounded-full text-[10px] font-bold uppercase tracking-wide ${styles[status] || 'bg-gray-100'}`}>
                    {status}
                </span>
            );
        };

        const UserInitial = ({ name, size = "md", className = "" }) => {
            const initials = name ? name.charAt(0).toUpperCase() : '?';
            const sizeClasses = {
                sm: "w-8 h-8 text-xs", md: "w-10 h-10 text-sm", lg: "w-14 h-14 text-xl", xl: "w-20 h-20 text-3xl"
            };
            const colors = ['bg-blue-500', 'bg-emerald-500', 'bg-violet-500', 'bg-rose-500', 'bg-amber-500'];
            const bgColor = colors[name ? name.charCodeAt(0) % colors.length : 0];

            return (
                <div className={`${sizeClasses[size]} ${bgColor} rounded-full flex items-center justify-center text-white font-bold shadow-sm ${className}`}>
                    {initials}
                </div>
            );
        };

        // MAIN APP
        function App() {
            const [isAuthenticated, setIsAuthenticated] = useState(false);
            const [currentUser, setCurrentUser] = useState(null);
            const [view, setView] = useState('dashboard');
            const [trainings, setTrainings] = useState(INITIAL_TRAININGS);
            const [selectedTraining, setSelectedTraining] = useState(null);
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [isSidebarOpen, setIsSidebarOpen] = useState(false);
            
            const TODAY = new Date('2026-02-10');

            // LOGIN COMPONENT
            const LoginView = () => {
                const [selectedUser, setSelectedUser] = useState("");
                const [passcode, setPasscode] = useState("");
                const [error, setError] = useState("");

                const handleLogin = () => {
                    const user = INITIAL_USERS.find(u => u.name === selectedUser);
                    if (user && passcode === getPasscode(user.name)) {
                        setCurrentUser(user);
                        setIsAuthenticated(true);
                        setView('dashboard');
                    } else {
                        setError("Invalid Passcode. Please try again.");
                    }
                };

                return (
                    <div className="min-h-screen bg-slate-900 flex items-center justify-center p-6 font-sans">
                        <div className="bg-white w-full max-w-md rounded-3xl shadow-2xl overflow-hidden animate-fade-in">
                            <div className="bg-indigo-600 p-10 text-center text-white">
                                <h1 className="text-4xl font-extrabold mb-2">Welcome!</h1>
                                <p className="text-indigo-100 opacity-80">Training Development Course 2026</p>
                            </div>
                            <div className="p-8 space-y-6">
                                <div className="space-y-1">
                                    <label className="text-xs font-bold text-gray-400 uppercase tracking-widest">Select Trainer</label>
                                    <select 
                                        className="w-full p-4 bg-gray-50 border border-gray-200 rounded-2xl focus:ring-2 focus:ring-indigo-500 outline-none transition-all"
                                        value={selectedUser}
                                        onChange={(e) => { setSelectedUser(e.target.value); setError(""); }}
                                    >
                                        <option value="">- Choose your name -</option>
                                        {INITIAL_USERS.map(u => <option key={u.id} value={u.name}>{u.name} {u.isAdmin ? '(Admin)' : ''}</option>)}
                                    </select>
                                </div>

                                {selectedUser && (
                                    <div className="space-y-1 animate-slide-up">
                                        <label className="text-xs font-bold text-gray-400 uppercase tracking-widest">Passcode</label>
                                        <div className="relative">
                                            <LockIcon />
                                            <input 
                                                type="password"
                                                placeholder="Enter ttbXXX"
                                                className="w-full pl-12 pr-4 py-4 bg-gray-50 border border-gray-200 rounded-2xl focus:ring-2 focus:ring-indigo-500 outline-none"
                                                value={passcode}
                                                onChange={(e) => setPasscode(e.target.value)}
                                                onKeyDown={(e) => e.key === 'Enter' && handleLogin()}
                                            />
                                        </div>
                                    </div>
                                )}

                                {error && <p className="text-red-500 text-sm text-center font-medium">{error}</p>}

                                <button 
                                    onClick={handleLogin}
                                    disabled={!selectedUser || !passcode}
                                    className="w-full bg-indigo-600 text-white py-4 rounded-2xl font-bold shadow-lg shadow-indigo-100 hover:bg-indigo-700 transition-all disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2"
                                >
                                    Enter System <ChevronRight />
                                </button>
                            </div>
                        </div>
                    </div>
                );
            };

            if (!isAuthenticated) return <LoginView />;

            // DASHBOARD VIEW
            const DashboardView = () => {
                const projectStats = COURSE_GROUPS.map(group => {
                    const groupTrainings = trainings.filter(t => group.courses.includes(t.course));
                    const total = groupTrainings.length;
                    const completed = groupTrainings.filter(t => t.status === 'Completed').length;
                    return { ...group, total, completed, percent: total > 0 ? Math.round((completed/total)*100) : 0 };
                });

                const myTrainings = trainings.filter(t => t.trainers.includes(currentUser.name));
                const myCompleted = myTrainings.filter(t => t.status === 'Completed').length;
                const myPercent = myTrainings.length > 0 ? Math.round((myCompleted / myTrainings.length) * 100) : 0;

                return (
                    <div className="space-y-8 animate-fade-in max-w-6xl mx-auto pb-10">
                        <div className="flex justify-between items-center">
                            <div>
                                <h1 className="text-2xl font-black text-gray-900">Dashboard</h1>
                                <p className="text-gray-500">Welcome, {currentUser.name}</p>
                            </div>
                            <div className="flex items-center gap-3 bg-white p-2 rounded-2xl border border-gray-100 shadow-sm">
                                <UserInitial name={currentUser.name} size="sm" />
                                <div className="hidden sm:block">
                                    <p className="text-xs font-bold text-gray-900">{currentUser.name}</p>
                                    <p className="text-[10px] text-gray-400">{currentUser.role}</p>
                                </div>
                            </div>
                        </div>

                        {/* Project Progress */}
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                            {projectStats.map((stat, i) => (
                                <div key={i} className="bg-white p-6 rounded-3xl border border-gray-100 shadow-sm hover:shadow-md transition-shadow">
                                    <div className={`w-8 h-8 ${stat.lightColor} ${stat.text} rounded-xl flex items-center justify-center mb-4`}>
                                        <TrendingIcon />
                                    </div>
                                    <h3 className="text-xs font-bold text-gray-400 uppercase tracking-widest mb-1">{stat.name}</h3>
                                    <div className="flex items-baseline gap-2 mb-3">
                                        <span className="text-3xl font-black text-gray-900">{stat.percent}%</span>
                                        <span className="text-xs text-gray-400">Done</span>
                                    </div>
                                    <div className="w-full bg-gray-100 h-2 rounded-full overflow-hidden">
                                        <div className={`${stat.color} h-full transition-all duration-1000`} style={{ width: `${stat.percent}%` }}></div>
                                    </div>
                                </div>
                            ))}
                        </div>

                        {/* My Summary */}
                        <div className="bg-white rounded-[2rem] border border-gray-100 shadow-xl overflow-hidden flex flex-col lg:flex-row">
                            <div className="lg:w-1/3 bg-slate-50 p-10 flex flex-col items-center text-center border-b lg:border-b-0 lg:border-r border-gray-100">
                                <UserInitial name={currentUser.name} size="xl" className="ring-8 ring-white shadow-xl mb-6" />
                                <h2 className="text-2xl font-black text-gray-900 mb-1">{currentUser.name}</h2>
                                <p className="text-indigo-600 font-bold text-sm mb-8">{currentUser.role}</p>
                                
                                <div className="w-full space-y-2">
                                    <div className="flex justify-between text-xs font-bold">
                                        <span className="text-gray-400 uppercase">My Progress</span>
                                        <span className="text-indigo-600">{myPercent}%</span>
                                    </div>
                                    <div className="w-full bg-gray-200 h-3 rounded-full overflow-hidden">
                                        <div className="bg-indigo-600 h-full transition-all duration-1000" style={{ width: `${myPercent}%` }}></div>
                                    </div>
                                    <p className="text-[10px] text-gray-400">{myCompleted} / {myTrainings.length} courses completed</p>
                                </div>
                            </div>
                            
                            <div className="lg:w-2/3 p-10">
                                <h3 className="text-xs font-bold text-gray-400 uppercase tracking-widest mb-8">Performance Highlights</h3>
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-8">
                                    <div className="flex items-center gap-5">
                                        <div className="p-4 bg-indigo-50 text-indigo-600 rounded-3xl"><ListIcon /></div>
                                        <div>
                                            <p className="text-3xl font-black text-gray-900">{myTrainings.length}</p>
                                            <p className="text-xs font-bold text-gray-400 uppercase">Total Tasks</p>
                                        </div>
                                    </div>
                                    <div className="flex items-center gap-5">
                                        <div className="p-4 bg-emerald-50 text-emerald-600 rounded-3xl"><CheckIcon /></div>
                                        <div>
                                            <p className="text-3xl font-black text-gray-900">{myCompleted}</p>
                                            <p className="text-xs font-bold text-gray-400 uppercase">Completed</p>
                                        </div>
                                    </div>
                                    <div className="flex items-center gap-5">
                                        <div className="p-4 bg-amber-50 text-amber-600 rounded-3xl"><ClockIcon /></div>
                                        <div>
                                            <p className="text-3xl font-black text-gray-900">{myTrainings.length - myCompleted}</p>
                                            <p className="text-xs font-bold text-gray-400 uppercase">Remaining</p>
                                        </div>
                                    </div>
                                    <div className="flex items-center gap-5">
                                        <div className="p-4 bg-rose-50 text-rose-600 rounded-3xl"><AwardIcon /></div>
                                        <div>
                                            <p className="text-3xl font-black text-gray-900">Rank A</p>
                                            <p className="text-xs font-bold text-gray-400 uppercase">Expertise</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            };

            // CALENDAR VIEW
            const CalendarView = () => {
                const [curr, setCurr] = useState(new Date('2026-02-01'));
                const next = () => setCurr(new Date(curr.setMonth(curr.getMonth() + 1)));
                const prev = () => setCurr(new Date(curr.setMonth(curr.getMonth() - 1)));
                
                const days = new Date(curr.getFullYear(), curr.getMonth() + 1, 0).getDate();
                const start = new Date(curr.getFullYear(), curr.getMonth(), 1).getDay();

                return (
                    <div className="bg-white rounded-3xl shadow-xl border border-gray-100 flex flex-col h-full animate-fade-in max-w-6xl mx-auto w-full overflow-hidden">
                        <div className="p-8 border-b border-gray-50 flex justify-between items-center bg-white">
                            <h2 className="text-2xl font-black text-gray-900">Training Calendar</h2>
                            <div className="flex items-center gap-4 bg-slate-50 p-2 rounded-2xl">
                                <button onClick={prev} className="p-2 hover:bg-white hover:shadow-sm rounded-xl transition-all"><ChevronLeft /></button>
                                <span className="font-bold text-lg min-w-[150px] text-center">{curr.toLocaleString('default', { month: 'long', year: 'numeric' })}</span>
                                <button onClick={next} className="p-2 hover:bg-white hover:shadow-sm rounded-xl transition-all"><ChevronRight /></button>
                            </div>
                        </div>
                        <div className="grid grid-cols-7 bg-slate-50 border-b border-gray-100">
                            {['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map(d => (
                                <div key={d} className="py-4 text-center text-[10px] font-black text-gray-400 uppercase tracking-widest">{d}</div>
                            ))}
                        </div>
                        <div className="grid grid-cols-7 flex-1 auto-rows-fr">
                            {Array.from({ length: 42 }).map((_, i) => {
                                const day = i - start + 1;
                                const isValid = day > 0 && day <= days;
                                const dStr = `2026-${String(curr.getMonth()+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
                                const evts = isValid ? trainings.filter(t => t.date === dStr) : [];
                                
                                return (
                                    <div key={i} className={`min-h-[120px] p-3 border-r border-b border-gray-50 relative group ${isValid ? 'bg-white' : 'bg-slate-50/30'}`}>
                                        {isValid && (
                                            <>
                                                <span className={`text-sm font-bold w-8 h-8 flex items-center justify-center rounded-xl mb-2 ${TODAY.toISOString().split('T')[0] === dStr ? 'bg-indigo-600 text-white' : 'text-gray-400'}`}>{day}</span>
                                                <div className="space-y-1">
                                                    {evts.map(e => (
                                                        <div 
                                                            key={e.id} 
                                                            onClick={() => { setSelectedTraining(e); setIsModalOpen(true); }}
                                                            className="text-[10px] p-2 bg-indigo-50 border border-indigo-100 text-indigo-700 rounded-lg truncate cursor-pointer font-bold hover:scale-105 transition-transform"
                                                        >
                                                            {e.course}
                                                        </div>
                                                    ))}
                                                </div>
                                            </>
                                        )}
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                );
            };

            // TRAINER VIEW
            const TrainerView = () => {
                const myTrainings = trainings.filter(t => t.trainers.includes(currentUser.name));
                return (
                    <div className="space-y-8 animate-fade-in max-w-6xl mx-auto w-full pb-10">
                        <div className="flex items-center gap-4">
                            <UserInitial name={currentUser.name} size="lg" />
                            <div>
                                <h2 className="text-3xl font-black text-gray-900">{currentUser.name}'s Portal</h2>
                                <p className="text-gray-500 font-medium">Personal Dashboard & Schedule</p>
                            </div>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                            <div className="bg-indigo-600 rounded-3xl p-8 text-white shadow-xl relative overflow-hidden">
                                <div className="relative z-10">
                                    <p className="text-indigo-100 font-bold uppercase tracking-widest text-[10px] mb-2">Completion Rate</p>
                                    <h3 className="text-4xl font-black mb-4">
                                        {Math.round((myTrainings.filter(t => t.status === 'Completed').length / myTrainings.length)*100) || 0}%
                                    </h3>
                                    <div className="w-full bg-white/20 h-2 rounded-full overflow-hidden">
                                        <div className="bg-white h-full" style={{ width: `${(myTrainings.filter(t => t.status === 'Completed').length / myTrainings.length)*100}%` }}></div>
                                    </div>
                                </div>
                                <AwardIcon className="absolute -bottom-6 -right-6 text-white/10 w-40 h-40" />
                            </div>
                            
                            <div className="bg-white p-8 rounded-3xl border border-gray-100 shadow-sm flex flex-col justify-center">
                                <div className="flex items-center gap-3 mb-2">
                                    <div className="p-3 bg-rose-50 text-rose-600 rounded-2xl"><TargetIcon /></div>
                                    <span className="font-bold text-gray-700">Next Class</span>
                                </div>
                                <p className="text-lg font-bold text-gray-900 truncate">
                                    {myTrainings.find(t => new Date(t.date) >= TODAY)?.course || 'No Classes'}
                                </p>
                                <p className="text-xs text-gray-400">Preparation required</p>
                            </div>

                            <div className="bg-white p-8 rounded-3xl border border-gray-100 shadow-sm flex flex-col justify-center">
                                <div className="flex items-center gap-3 mb-2">
                                    <div className="p-3 bg-emerald-50 text-emerald-600 rounded-2xl"><CheckIcon /></div>
                                    <span className="font-bold text-gray-700">Total Hours</span>
                                </div>
                                <p className="text-3xl font-black text-gray-900">{myTrainings.filter(t => t.status === 'Completed').length * 8} hrs</p>
                                <p className="text-xs text-gray-400">Confirmed training hours</p>
                            </div>
                        </div>

                        <div className="bg-white rounded-[2rem] shadow-xl border border-gray-100 overflow-hidden">
                            <div className="p-8 border-b border-gray-50 flex justify-between items-center">
                                <h3 className="font-black text-gray-900">Personal Schedule</h3>
                                <button className="text-xs font-bold text-indigo-600 hover:underline">View All</button>
                            </div>
                            <div className="divide-y divide-gray-50">
                                {myTrainings.map(t => (
                                    <div key={t.id} className="p-6 flex flex-col md:flex-row md:items-center justify-between hover:bg-slate-50 transition-all group">
                                        <div className="flex items-center gap-6">
                                            <div className={`w-16 h-16 flex flex-col items-center justify-center rounded-2xl border ${new Date(t.date) < TODAY ? 'bg-slate-100 text-slate-400 border-slate-200' : 'bg-indigo-50 text-indigo-700 border-indigo-100'}`}>
                                                <span className="text-[10px] font-black uppercase">{new Date(t.date).toLocaleString('default', { month: 'short' })}</span>
                                                <span className="text-2xl font-black">{new Date(t.date).getDate()}</span>
                                            </div>
                                            <div>
                                                <h4 className="font-bold text-gray-900 group-hover:text-indigo-600 transition-colors">{t.course}</h4>
                                                <div className="flex items-center gap-3 mt-1">
                                                    <span className="text-xs text-gray-400 flex items-center gap-1"><MapPinIcon /> {t.location}</span>
                                                    <span className="text-xs text-gray-400 flex items-center gap-1"><TargetIcon /> {t.rh}</span>
                                                </div>
                                            </div>
                                        </div>
                                        <div className="mt-4 md:mt-0 flex items-center gap-4">
                                            <StatusBadge status={t.status} />
                                            <button onClick={() => { setSelectedTraining(t); setIsModalOpen(true); }} className="p-2 text-gray-400 hover:text-indigo-600 transition-colors">
                                                <ChevronRight />
                                            </button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                );
            };

            // SCHEDULE VIEW
            const ScheduleView = () => {
                const [q, setQ] = useState('');
                const filtered = trainings.filter(t => t.course.toLowerCase().includes(q.toLowerCase()) || t.location.toLowerCase().includes(q.toLowerCase()));
                
                return (
                    <div className="bg-white rounded-3xl shadow-xl border border-gray-100 overflow-hidden flex flex-col h-full animate-fade-in max-w-7xl mx-auto">
                        <div className="p-8 bg-white border-b border-gray-50 flex flex-col md:flex-row md:items-center justify-between gap-6">
                            <h2 className="text-2xl font-black text-gray-900">Training Schedule</h2>
                            <div className="flex items-center gap-4">
                                <div className="relative">
                                    <SearchIcon />
                                    <input 
                                        type="text" 
                                        placeholder="Search by course..." 
                                        className="pl-12 pr-4 py-3 bg-slate-50 border-none rounded-2xl text-sm focus:ring-2 focus:ring-indigo-500 transition-all w-64"
                                        value={q}
                                        onChange={(e) => setQ(e.target.value)}
                                    />
                                </div>
                                {currentUser.isAdmin && (
                                    <button 
                                        onClick={() => { setSelectedTraining({ id: Date.now(), date: '', endDate: '', course: COURSES[0], segment: SEGMENTS[0], zone: ZONES[0], rh: RHS[0], location: '', trainers: [], status: 'Planned', confirmed: false, attendees: 0 }); setIsModalOpen(true); }}
                                        className="bg-indigo-600 text-white p-3 rounded-2xl shadow-lg shadow-indigo-100 hover:bg-indigo-700 transition-all"
                                    >
                                        <PlusIcon />
                                    </button>
                                )}
                            </div>
                        </div>
                        <div className="overflow-x-auto">
                            <table className="w-full text-left text-sm whitespace-nowrap">
                                <thead className="bg-slate-50 border-b border-gray-100 text-[10px] font-black text-gray-400 uppercase tracking-widest">
                                    <tr>
                                        <th className="px-8 py-4">Date</th>
                                        <th className="px-8 py-4">Course</th>
                                        <th className="px-8 py-4">RH / Zone</th>
                                        <th className="px-8 py-4">Location</th>
                                        <th className="px-8 py-4">Trainers</th>
                                        <th className="px-8 py-4">Status</th>
                                        <th className="px-8 py-4 text-right">Action</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-gray-50">
                                    {filtered.map(t => (
                                        <tr key={t.id} className="hover:bg-slate-50/50 transition-colors">
                                            <td className="px-8 py-6 font-bold text-gray-900">{new Date(t.date).toLocaleDateString('en-GB')}</td>
                                            <td className="px-8 py-6 text-indigo-600 font-bold">{t.course}</td>
                                            <td className="px-8 py-6 font-medium text-gray-500">{t.rh} <span className="text-[10px] opacity-40 ml-1">({t.zone})</span></td>
                                            <td className="px-8 py-6 text-gray-500 truncate max-w-[200px]">{t.location}</td>
                                            <td className="px-8 py-6">
                                                <div className="flex -space-x-2">
                                                    {t.trainers.slice(0,3).map((tr, i) => <UserInitial key={i} name={tr} size="sm" className="ring-2 ring-white" />)}
                                                    {t.trainers.length > 3 && <div className="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center text-[10px] font-bold text-gray-400 ring-2 ring-white">+{t.trainers.length-3}</div>}
                                                </div>
                                            </td>
                                            <td className="px-8 py-6"><StatusBadge status={t.status} /></td>
                                            <td className="px-8 py-6 text-right">
                                                <button onClick={() => { setSelectedTraining(t); setIsModalOpen(true); }} className="text-indigo-600 font-bold text-xs uppercase tracking-widest hover:underline">Edit</button>
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>
                );
            };

            // MODAL COMPONENT
            const Modal = () => {
                if (!isModalOpen || !selectedTraining) return null;
                const [form, setForm] = useState(selectedTraining);
                const isPast = new Date(form.date) <= TODAY;

                const handleSave = () => {
                    if (!currentUser.isAdmin) return;
                    setTrainings(prev => {
                        const idx = prev.findIndex(t => t.id === form.id);
                        if (idx >= 0) {
                            const updated = [...prev];
                            updated[idx] = form;
                            return updated;
                        }
                        return [...prev, form];
                    });
                    setIsModalOpen(false);
                };

                return (
                    <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-md z-[100] flex items-center justify-center p-6 animate-fade-in">
                        <div className="bg-white w-full max-w-2xl rounded-[2.5rem] shadow-2xl overflow-hidden animate-slide-up">
                            <div className="p-10 border-b border-gray-50 flex justify-between items-center">
                                <h3 className="text-2xl font-black text-gray-900">Training Details</h3>
                                <button onClick={() => setIsModalOpen(false)} className="p-3 bg-slate-50 rounded-2xl hover:bg-slate-100 transition-all"><XIcon /></button>
                            </div>
                            
                            <div className="p-10 grid grid-cols-1 md:grid-cols-2 gap-8 max-h-[60vh] overflow-y-auto custom-scrollbar">
                                <div className="space-y-1">
                                    <label className="text-[10px] font-black text-gray-400 uppercase tracking-widest">Course Name</label>
                                    <select disabled={!currentUser.isAdmin} className="w-full p-4 bg-slate-50 rounded-2xl font-bold border-none" value={form.course} onChange={e => setForm({...form, course: e.target.value})}>
                                        {COURSES.map(c => <option key={c} value={c}>{c}</option>)}
                                    </select>
                                </div>
                                <div className="space-y-1">
                                    <label className="text-[10px] font-black text-gray-400 uppercase tracking-widest">Region (RH)</label>
                                    <select disabled={!currentUser.isAdmin} className="w-full p-4 bg-slate-50 rounded-2xl font-bold border-none" value={form.rh} onChange={e => setForm({...form, rh: e.target.value})}>
                                        {RHS.map(rh => <option key={rh} value={rh}>{rh}</option>)}
                                    </select>
                                </div>
                                <div className="space-y-1">
                                    <label className="text-[10px] font-black text-gray-400 uppercase tracking-widest">Training Date</label>
                                    <input disabled={!currentUser.isAdmin} type="date" className="w-full p-4 bg-slate-50 rounded-2xl font-bold border-none" value={form.date} onChange={e => setForm({...form, date: e.target.value})} />
                                </div>
                                <div className="space-y-1">
                                    <label className="text-[10px] font-black text-gray-400 uppercase tracking-widest">Status</label>
                                    <select 
                                        className="w-full p-4 bg-slate-50 rounded-2xl font-bold border-none" 
                                        value={form.status} 
                                        onChange={e => {
                                            if (e.target.value === 'Completed' && !isPast) {
                                                alert('Cannot complete before training date!');
                                                return;
                                            }
                                            setForm({...form, status: e.target.value});
                                        }}
                                    >
                                        <option value="Planned">Planned</option>
                                        <option value="Confirmed">Confirmed</option>
                                        <option value="Completed">Completed</option>
                                        <option value="Cancelled">Cancelled</option>
                                    </select>
                                </div>
                                <div className="md:col-span-2 space-y-1">
                                    <label className="text-[10px] font-black text-gray-400 uppercase tracking-widest">Location / Hotel</label>
                                    <input disabled={!currentUser.isAdmin} className="w-full p-4 bg-slate-50 rounded-2xl font-bold border-none" value={form.location} onChange={e => setForm({...form, location: e.target.value})} />
                                </div>
                                <div className="md:col-span-2 space-y-3">
                                    <label className="text-[10px] font-black text-gray-400 uppercase tracking-widest">Assign Trainers</label>
                                    <div className="flex flex-wrap gap-2">
                                        {INITIAL_USERS.map(u => (
                                            <button 
                                                key={u.id}
                                                disabled={!currentUser.isAdmin}
                                                onClick={() => {
                                                    const has = form.trainers.includes(u.name);
                                                    setForm({...form, trainers: has ? form.trainers.filter(t => t !== u.name) : [...form.trainers, u.name]});
                                                }}
                                                className={`px-4 py-2 rounded-xl text-xs font-bold border transition-all ${form.trainers.includes(u.name) ? 'bg-indigo-600 text-white border-indigo-600 shadow-lg shadow-indigo-100' : 'bg-white text-gray-400 border-gray-100'}`}
                                            >
                                                {u.name}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            </div>

                            <div className="p-10 bg-slate-50 border-t border-gray-100 flex justify-end gap-4">
                                <button onClick={() => setIsModalOpen(false)} className="px-8 py-4 text-sm font-bold text-gray-400 hover:text-gray-600">Cancel</button>
                                {currentUser.isAdmin && (
                                    <button onClick={handleSave} className="px-8 py-4 bg-indigo-600 text-white rounded-2xl font-bold shadow-xl shadow-indigo-100 hover:bg-indigo-700 transition-all">Save Changes</button>
                                )}
                            </div>
                        </div>
                    </div>
                );
            };

            // NAVIGATION ITEMS
            const navItems = [
                { id: 'dashboard', label: 'Dashboard', icon: <DashboardIcon /> },
                { id: 'schedule', label: 'Schedule', icon: <ListIcon /> },
                { id: 'calendar', label: 'Calendar', icon: <CalendarIcon /> },
                { id: 'trainerView', label: 'My Portal', icon: <UserIcon /> },
                { id: 'reports', label: 'Reports', icon: <ChartIcon /> },
            ];

            // MAIN RENDER
            return (
                <div className="flex h-screen bg-white font-sans text-gray-900 overflow-hidden">
                    {/* Sidebar Desktop */}
                    <aside className="hidden lg:flex w-72 flex-col bg-slate-900 text-white p-8">
                        <div className="flex items-center gap-4 mb-12">
                            <div className="w-10 h-10 bg-indigo-500 rounded-2xl flex items-center justify-center shadow-lg shadow-indigo-500/30"><HomeIcon /></div>
                            <h1 className="text-lg font-black tracking-tight leading-tight">2026 TRAINING</h1>
                        </div>
                        <nav className="flex-1 space-y-2">
                            {navItems.map(item => (
                                <button
                                    key={item.id}
                                    onClick={() => setView(item.id)}
                                    className={`w-full flex items-center gap-4 px-6 py-4 rounded-2xl text-sm font-bold transition-all ${view === item.id ? 'bg-indigo-600 text-white shadow-xl shadow-indigo-600/20' : 'text-slate-400 hover:bg-white/5 hover:text-white'}`}
                                >
                                    {item.icon} {item.label}
                                </button>
                            ))}
                        </nav>
                        <div className="mt-auto pt-8 border-t border-white/5">
                            <button 
                                onClick={() => { setIsAuthenticated(false); setView('home'); }}
                                className="w-full flex items-center gap-4 px-6 py-4 rounded-2xl text-sm font-bold text-slate-500 hover:text-rose-400 transition-colors"
                            >
                                <LogoutIcon /> Logout
                            </button>
                        </div>
                    </aside>

                    {/* Main Container */}
                    <div className="flex-1 flex flex-col min-w-0">
                        <header className="lg:hidden h-16 bg-white border-b border-gray-100 px-6 flex items-center justify-between">
                            <h1 className="font-black text-indigo-600">2026 TRAINING</h1>
                            <button onClick={() => setIsSidebarOpen(!isSidebarOpen)}><MenuIcon /></button>
                        </header>
                        
                        <main className="flex-1 overflow-y-auto p-6 md:p-10 bg-white">
                            {view === 'dashboard' && <DashboardView />}
                            {view === 'schedule' && <ScheduleView />}
                            {view === 'calendar' && <CalendarView />}
                            {view === 'trainerView' && <TrainerView />}
                            {view === 'reports' && <div className="text-center py-10"><p className="text-gray-500">Reports view coming soon...</p></div>}
                        </main>
                    </div>

                    <Modal />
                </div>
            );
        }

        // Render the app
        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
